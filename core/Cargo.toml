[package]
name = "colorust-core"
version = "1.0.0"
edition = "2021"
authors = ["Jonas Monteiro"]
description = "Core perceptual color science engine, OKLCH conversions, and WCAG/APCA contrast algorithms"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
colored = { version = "2.1", optional = true }

[features]
default = ["parallel", "cli"]
parallel = ["dep:rayon"]
cli = ["dep:clap", "dep:colored"]

[[bin]]
name = "colorust"
path = "src/bin/colorust.rs"
required-features = ["cli"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "bench_color_science"
harness = false



